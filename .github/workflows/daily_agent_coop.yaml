name: Agente de Noticias Cooperativas Latinoamericanas

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-agent:
    runs-on: ubuntu-latest
    
    # 🔥 TIMEOUT DE 10 MINUTOS PARA EL JOB
    timeout-minutes: 10
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🔥 Instalar Deno - necesario para yt-dlp
      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ============================================
      # CONFIGURAR SSL
      # ============================================
      - name: Configurar SSL y certificados
        run: |
          echo "🔐 Configurando SSL..."
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          python -c "import ssl; print(f'SSL version: {ssl.OPENSSL_VERSION}')"
          echo "✅ SSL configurado"

      # ============================================
      # VERIFICAR SECRETS
      # ============================================
      - name: Verificar Secrets
        run: |
          echo "🔍 Verificando configuración..."
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "✅ DEEPSEEK_API_KEY configurada"
          else
            echo "❌ DEEPSEEK_API_KEY NO configurada"
            exit 1
          fi

      # ============================================
      # RESTAURAR COOKIES Y TOKENS
      # ============================================
      - name: Restaurar cookies de YouTube
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 -d > cookies.txt
            echo "✅ cookies.txt creado."
          else
            echo "ℹ️ YOUTUBE_COOKIES no configurada (opcional)"
          fi

      - name: Restaurar token de Google Drive
        run: |
          if [ -n "${{ secrets.DRIVE_TOKEN_JSON }}" ]; then
            echo "${{ secrets.DRIVE_TOKEN_JSON }}" | base64 -d > token.json
            echo "✅ token.json creado."
          else
            echo "ℹ️ DRIVE_TOKEN_JSON no configurada (opcional)"
          fi

      # ============================================
      # VERIFICAR ARCHIVOS
      # ============================================
      - name: Verificar archivos del proyecto
        run: |
          echo "📁 Verificando archivos críticos:"
          FILES=("main.py" "config_countries.json" "requirements.txt" 
                 "cooperative_fetcher.py" "cooperative_processor.py" 
                 "summary_generator_coop.py" "document_generator_coop.py"
                 "topic_index.py" "audio_generator.py" "drive_uploader.py")
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file encontrado"
            else
              echo "❌ $file NO encontrado"
              exit 1
            fi
          done

      # ============================================
      # INSTALAR DEPENDENCIAS
      # ============================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencias instaladas"
          pip list | head -20

      # ============================================
      # 🔥 EJECUTAR AGENTE CON TIMEOUT Y LOGS
      # ============================================
      - name: Ejecutar Agente Cooperativo
        run: |
          echo "⏱️ Ejecutando agente con timeout de 8 minutos..."
          timeout 480 python -u main.py 2>&1 | tee agent_output.log
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PYTHONHTTPSVERIFY: 0
          REQUESTS_TIMEOUT: 60
          PYTHONUNBUFFERED: 1

      # ============================================
      # VERIFICAR ARCHIVOS GENERADOS
      # ============================================
      - name: Verificar archivos generados
        run: |
          echo "📁 Archivos generados:"
          ls -la
          echo ""
          echo "📁 Verificando archivos de salida:"
          if [ -f "index.html" ]; then
            echo "✅ index.html generado"
            echo "📄 Tamaño: $(wc -c < index.html) bytes"
          else
            echo "⚠️ index.html no encontrado"
          fi
          if [ -f "resumen_cooperativo.mp3" ]; then
            echo "✅ resumen_cooperativo.mp3 generado"
            echo "📄 Tamaño: $(wc -c < resumen_cooperativo.mp3) bytes"
          fi
          if [ -d "historial_cooperativo" ]; then
            echo "✅ historial_cooperativo/ creado"
            echo "📁 Contenido: $(ls -la historial_cooperativo/ | wc -l) archivos"
          fi

      # ============================================
      # SUBIR ARTEFACTO PARA GITHUB PAGES
      # ============================================
      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./

  deploy-pages:
    needs: build-agent
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
