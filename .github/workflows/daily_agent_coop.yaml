name: Agente de Noticias Cooperativas Latinoamericanas

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🔥 Instalar Deno - necesario para yt-dlp con cookies
      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ============================================
      # CONFIGURAR SSL PARA SITIOS PROBLEMÁTICOS
      # ============================================
      - name: Configurar SSL y certificados
        run: |
          echo "🔐 Configurando SSL..."
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          python -c "import ssl; print(f'SSL version: {ssl.OPENSSL_VERSION}')"
          echo "✅ SSL configurado"

      # ============================================
      # VERIFICAR SECRETS
      # ============================================
      - name: Verificar Secrets
        run: |
          echo "🔍 Verificando configuración..."
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "✅ DEEPSEEK_API_KEY configurada"
          else
            echo "❌ DEEPSEEK_API_KEY NO configurada"
            echo "   ⚠️ El agente NO funcionará sin esta clave"
            exit 1
          fi

      # ============================================
      # RESTAURAR COOKIES DE YOUTUBE (opcional)
      # ============================================
      - name: Restaurar cookies de YouTube
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" | base64 -d > cookies.txt
            echo "✅ cookies.txt creado."
          else
            echo "ℹ️ YOUTUBE_COOKIES no configurada (opcional)"
          fi

      # ============================================
      # RESTAURAR TOKEN DE GOOGLE DRIVE (opcional)
      # ============================================
      - name: Restaurar token de Google Drive
        run: |
          if [ -n "${{ secrets.DRIVE_TOKEN_JSON }}" ]; then
            echo "${{ secrets.DRIVE_TOKEN_JSON }}" | base64 -d > token.json
            echo "✅ token.json creado."
          else
            echo "ℹ️ DRIVE_TOKEN_JSON no configurada (opcional)"
          fi

      # ============================================
      # VERIFICAR ARCHIVOS DEL PROYECTO
      # ============================================
      - name: Verificar archivos del proyecto
        run: |
          echo "📁 Archivos en el repositorio:"
          ls -la
          echo ""
          echo "📁 Verificando archivos críticos:"
          FILES=("main.py" "config_countries.json" "requirements.txt" 
                 "cooperative_fetcher.py" "cooperative_processor.py" 
                 "summary_generator_coop.py" "document_generator_coop.py"
                 "drive_uploader.py" "audio_generator.py"
                 "topic_index.py" "youtube_fetcher.py")
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file encontrado"
            else
              echo "⚠️ $file NO encontrado (opcional)"
            fi
          done

      # ============================================
      # INSTALAR DEPENDENCIAS
      # ============================================
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
            echo "✅ Dependencias instaladas"
          else
            echo "❌ requirements.txt no encontrado"
            exit 1
          fi
          echo "📦 Dependencias instaladas:"
          pip list

      # ============================================
      # EJECUTAR AGENTE COOPERATIVO CON IA-COOP-LAB
      # ============================================
      - name: Ejecutar Agente Cooperativo
        run: python main.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PARENT_FOLDER_ID: ${{ secrets.PARENT_FOLDER_ID }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # 🔑 Deshabilitar verificación SSL para sitios problemáticos
          PYTHONHTTPSVERIFY: 0
          # 🔑 Configurar timeout más largo
          REQUESTS_TIMEOUT: 60

      # ============================================
      # VERIFICAR ARCHIVOS GENERADOS
      # ============================================
      - name: Verificar archivos generados
        run: |
          echo "📁 Archivos generados:"
          ls -la
          echo ""
          echo "📁 Verificando archivos de salida:"
          if [ -f "index.html" ]; then
            echo "✅ index.html generado"
            echo "📄 Tamaño: $(wc -c < index.html) bytes"
          else
            echo "⚠️ index.html no encontrado"
          fi
          if [ -f "resumen_cooperativo.mp3" ]; then
            echo "✅ resumen_cooperativo.mp3 generado"
            echo "📄 Tamaño: $(wc -c < resumen_cooperativo.mp3) bytes"
          else
            echo "ℹ️ resumen_cooperativo.mp3 no generado (opcional)"
          fi
          if [ -d "historial_cooperativo" ]; then
            echo "✅ historial_cooperativo/ creado"
            echo "📁 Contenido: $(ls -la historial_cooperativo/ | wc -l) archivos"
          else
            echo "⚠️ historial_cooperativo/ no encontrado"
          fi
          if [ -f "topic_index.json" ]; then
            echo "✅ topic_index.json generado"
          else
            echo "ℹ️ topic_index.json no generado (opcional)"
          fi

      # ============================================
      # SUBIR ARTEFACTO PARA GITHUB PAGES
      # ============================================
      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./

  # ============================================
  # DEPLOY A GITHUB PAGES
  # ============================================
  deploy-pages:
    needs: build-agent
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
